<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Serpent's Coil</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;600;700&display=swap');

    :root {
      --gold: #d6a24a;
      --gold-bright: #f1c40f;
      --gold-muted: #9b6a1f;
      --bone: #d8d1bf;
      --panel: #111111;
    }

    * {
      box-sizing: border-box;
    }

  body {
      margin: 0;
      background: #000;
      color: var(--bone);
      font-family: Inter, sans-serif;
      min-height: 100vh;
      overflow: hidden;
}

    .font-cinzel {
      font-family: Cinzel, serif;
    }

    .gold-glow {
      color: var(--gold);
      text-shadow: 0 0 16px rgba(214,162,74,.5);
    }

    .app-shell {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    header {
      border-bottom: 1px solid rgba(155,106,31,.7);
      background: rgba(0,0,0,.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 20;
    }

    .panel {
      background: rgba(17,17,17,.9);
      border: 1px solid rgba(155,106,31,.55);
      box-shadow: 0 0 24px rgba(214,162,74,.08);
    }

    .chat-area {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      min-height: 0;
      height: 100%;
    }

    .main-chat {
      display: grid;
      grid-template-rows: 1fr auto;
      min-width: 0;
      min-height: 0;
    }

    .messages {
      overflow-y: auto;
      padding: 1rem;
      min-height: 0;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 800px;
      margin-bottom: 1rem;
      padding: 1rem;
      border-radius: 1rem;
      background: rgba(31,41,55,.75);
      border: 1px solid rgba(155,106,31,.28);
      overflow-wrap: anywhere;
    }

    .message.self {
      margin-left: auto;
      background: rgba(214,162,74,.18);
      border-color: rgba(214,162,74,.55);
    }

    .message-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: .45rem;
      margin-bottom: .5rem;
    }

    .username {
      color: var(--gold);
      font-family: Cinzel, serif;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .username:hover {
      color: #ffd27a;
      text-shadow: 0 0 12px rgba(214,162,74,.6);
    }

    .rank-pill {
      display: inline-block;
      padding: .12rem .45rem;
      border: 1px solid rgba(214,162,74,.45);
      border-radius: 999px;
      font-size: .7rem;
      color: #d6b36a;
      background: rgba(0,0,0,.35);
    }

    .rank-guest { color: #9ca3af; border-color: rgba(156,163,175,.35); }
    .rank-admin { color: #f1c40f; border-color: rgba(241,196,15,.7); }
    .rank-system { color: #b8a06a; border-color: rgba(155,106,31,.65); }
    .message.admin { background: rgba(214,162,74,.22); border-color: rgba(241,196,15,.7); box-shadow:0 0 20px rgba(214,162,74,.12); }
    .message.system { background: rgba(0,0,0,.55); border-color: rgba(155,106,31,.5); color:#b8a06a; }
    .message.fading { opacity: .45; }
    .hidden { display: none !important; }

    .time {
      font-size: .72rem;
      color: #6b7280;
    }

    .btn {
      border: 1px solid var(--gold-muted);
      color: var(--gold);
      padding: .7rem 1rem;
      border-radius: .65rem;
      background: rgba(0,0,0,.35);
      transition: .2s ease;
      font-family: Cinzel, serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: .82rem;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .btn:hover {
      color: #ffd27a;
      box-shadow: 0 0 18px rgba(214,162,74,.22);
    }

    .btn-danger {
      color: #fca5a5;
      border-color: rgba(185, 28, 28, .7);
    }

    input {
      background: rgba(0,0,0,.45);
      border: 1px solid rgba(155,106,31,.7);
      color: var(--bone);
      outline: none;
      min-width: 0;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 12px rgba(214,162,74,.18);
    }

    .sidebar {
      border-left: 1px solid rgba(155,106,31,.45);
      background: rgba(0,0,0,.35);
      overflow-y: auto;
      min-height: 0;
    }

    .member-card {
      display: block;
      border: 1px solid rgba(155,106,31,.35);
      background: rgba(17,17,17,.82);
      border-radius: .85rem;
      padding: .8rem;
      margin-bottom: .75rem;
      text-decoration: none;
      color: var(--bone);
      transition: .2s ease;
    }

    .member-card:hover {
      border-color: var(--gold);
      box-shadow: 0 0 14px rgba(214,162,74,.15);
      transform: translateY(-1px);
    }

    .emoji-row {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
      max-height: 96px;
      overflow-y: auto;
      padding-right: .25rem;
    }

    .emoji-btn {
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(214,162,74,0.35);
      color: #d6a24a;
      border-radius: 10px;
      padding: 6px 10px;
      transition: 0.2s ease;
      cursor: pointer;
      font-size: 1.15rem;
      line-height: 1.2;
    }

    .emoji-btn:hover {
      border-color: #d6a24a;
      box-shadow: 0 0 12px rgba(214,162,74,0.22);
      transform: scale(1.08);
    }

    .status-line {
      color: #8b6f32;
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-family: Cinzel, serif;
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .app-shell {
        height: auto;
        min-height: 100vh;
      }

      .chat-area {
        grid-template-columns: 1fr;
      }

      .main-chat {
        min-height: calc(100vh - 92px);
      }

      .sidebar {
        display: none;
      }

      header {
        flex-wrap: wrap;
      }

      .header-actions {
        width: 100%;
        justify-content: flex-start;
        overflow-x: auto;
        padding-bottom: .2rem;
      }
    }

    @media (max-width: 540px) {
      .message {
        max-width: 100%;
      }

      .composer {
        margin: .65rem;
        padding: .65rem;
      }

      .composer-form {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        text-align: center;
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <header class="px-5 py-4 flex items-center justify-between gap-4">
      <div class="flex items-center gap-4 min-w-0">
        <img src="favicon.png" alt="The Order" class="w-14 h-14 object-contain rounded-full border border-yellow-800/60 shadow-[0_0_16px_rgba(214,162,74,.22)] flex-shrink-0">
        <div class="min-w-0">
          <h1 class="font-cinzel text-2xl md:text-3xl gold-glow tracking-[.16em] uppercase truncate">The Serpent's Coil</h1>
          <p class="text-xs text-gray-400 tracking-[.18em] uppercase" id="roomSubtitle">Connecting to the archive...</p>
        </div>
      </div>

      <nav class="header-actions flex items-center gap-3">
        <a class="btn" href="./profile.html?uid=me">My Portfolio</a>
        <button class="btn" id="identityBtn" type="button">Identity</button>
        <button class="btn" id="codeBtn" type="button">Access Code</button>
        <button class="btn btn-danger hidden" id="clearChatBtn" type="button">Clear Room</button>
        <a class="btn" href="./index.html">Return</a>
      </nav>
    </header>

    <main class="chat-area">
      <section class="main-chat">
        <div class="room-bar p-3 flex flex-wrap items-center justify-between gap-3" style="border-bottom:1px solid rgba(155,106,31,.45);background:rgba(0,0,0,.35);">
          <div class="flex flex-wrap items-center gap-3">
            <span class="status-line">Room</span>
            <select id="roomSelect" class="btn">
              <option value="guest">Outer Coil</option>
              <option value="approved">Inner Coil</option>
              <option value="admin">Black Ledger</option>
            </select>
          </div>
          <div class="status-line" id="roleStatus">Connecting...</div>
        </div>

        <div id="messages" class="messages"></div>

        <div class="panel composer m-4 p-3 rounded-2xl">
          <div class="flex items-center justify-between gap-3 mb-3">
            <div class="status-line">Symbols of the Coil</div>
            <div class="status-line" id="messageCount">0 archived</div>
          </div>

          <div class="emoji-row mb-3" id="emojiBar">
            <button type="button" class="emoji-btn">🎭</button>
            <button type="button" class="emoji-btn">🜂</button>
            <button type="button" class="emoji-btn">☿</button>
            <button type="button" class="emoji-btn">🜏</button>
            <button type="button" class="emoji-btn">⚚</button>
            <button type="button" class="emoji-btn">☾</button>
            <button type="button" class="emoji-btn">👁️</button>
            <button type="button" class="emoji-btn">🕯️</button>
            <button type="button" class="emoji-btn">🐍</button>
            <button type="button" class="emoji-btn">🩸</button>
            <button type="button" class="emoji-btn">📜</button>
            <button type="button" class="emoji-btn">⚖️</button>
            <button type="button" class="emoji-btn">🪽</button>
            <button type="button" class="emoji-btn">🕳️</button>
            <button type="button" class="emoji-btn">⛓️</button>
            <button type="button" class="emoji-btn">🗝️</button>
          </div>

          <form id="messageForm" class="composer-form flex gap-3">
            <input id="messageInput" maxlength="500" class="flex-1 rounded-xl px-4 py-3" placeholder="Speak into the Coil..." required disabled>
            <button class="btn" id="sendBtn" type="submit" disabled>Send</button>
          </form>
        </div>
      </section>

      <aside class="sidebar p-4">
        <h2 class="font-cinzel gold-glow text-xl mb-4 tracking-[.15em] uppercase">Initiates</h2>
        <div id="members"></div>
      </aside>
    </main>
  </div>

  <script type="module">
    const firebaseConfig = {
      apiKey: "AIzaSyC7jzp92jTjtGX9Dxp_MMTcaEGHsveufB0",
      authDomain: "weeping-order.firebaseapp.com",
      projectId: "weeping-order",
      storageBucket: "weeping-order.firebasestorage.app",
      messagingSenderId: "439201717119",
      appId: "1:439201717119:web:924a56ec0baf738972d84a",
      measurementId: "G-EQ3CC4EM5C"
    };

    const ADMIN_CODES = ["FIRST-WEEPER-0001", "FIRST-WEEPER-0002", "SKYHERO-ADMIN-TEST"];
    const GUEST_MESSAGE_LIFETIME_MS = 5 * 60 * 1000;
    const GUEST_COOLDOWN_MS = 4000;

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      getFirestore, collection, doc, getDoc, setDoc, addDoc, deleteDoc,
      updateDoc, onSnapshot, query, where, orderBy, serverTimestamp, limit, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const messagesEl = document.getElementById("messages");
    const membersEl = document.getElementById("members");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const clearChatBtn = document.getElementById("clearChatBtn");
    const messageCount = document.getElementById("messageCount");
    const roleStatus = document.getElementById("roleStatus");
    const roomNotice = document.getElementById("members").parentElement;
    const roomSubtitle = document.getElementById("roomSubtitle");
    const identityBtn = document.getElementById("identityBtn");
    const codeBtn = document.getElementById("codeBtn");
    const roomSelect = document.getElementById("roomSelect");

    let app = initializeApp(firebaseConfig);
    let auth = getAuth(app);
    let db = getFirestore(app);
    let currentUser = null;
    let currentRoom = localStorage.getItem("coil_current_room") || "guest";
    let latestMessages = [];
    let unsubscribeMessages = null;
    let unsubscribeMembers = null;
    let lastGuestSend = Number(localStorage.getItem("coil_last_guest_send") || "0");

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      currentUser = await loadOrCreateProfile(user.uid);
      await touchProfile();
      enableChat();
      await seedBotMessagesIfEmpty();
      setupRoom(currentRoom);
      listenMembers();
    });

    signInAnonymously(auth).catch((error) => {
      fail("Anonymous sign-in failed: " + error.message);
    });

    function fail(text) {
      roomSubtitle.textContent = "Connection failed";
      roleStatus.textContent = "Offline";
      messageInput.disabled = true;
      sendBtn.disabled = true;
      console.error(text);
      alert(text);
    }

    function enableChat() {
      messageInput.disabled = false;
      sendBtn.disabled = false;
    }

    async function loadOrCreateProfile(uid) {
      const ref = doc(db, "profiles", uid);
      const snap = await getDoc(ref);
      if (snap.exists()) return { uid, ...snap.data() };

      const username = localStorage.getItem("coil_username") || "Guest Witness";
      const profile = {
        uid, username, rank: "Guest", role: "guest", initiateNumber: "------",
        status: "transient", bio: "A temporary voice in the Outer Coil.",
        badges: ["Transient Witness"], createdAt: serverTimestamp(), lastSeen: serverTimestamp()
      };
      await setDoc(ref, profile, { merge: true });
      return profile;
    }

    async function touchProfile() {
      if (!currentUser) return;
      await setDoc(doc(db, "profiles", currentUser.uid), {
        username: currentUser.username || "Guest Witness",
        rank: currentUser.rank || "Guest",
        role: currentUser.role || "guest",
        initiateNumber: currentUser.initiateNumber || "------",
        status: currentUser.status || "transient",
        bio: currentUser.bio || "",
        badges: currentUser.badges || [],
        lastSeen: serverTimestamp()
      }, { merge: true });
    }

    async function seedBotMessagesIfEmpty() {
      const q = query(collection(db, "messages"), where("room", "==", "guest"), limit(5));
      const snapshot = await getDocs(q);
      if (!snapshot.empty) return;

      await addDoc(collection(db, "messages"), {
        room: "guest", uid: "system-archive", username: "Archive", rank: "System", role: "system",
        text: "The Coil is open. The first whispers have been archived.",
        createdAt: serverTimestamp(), expiresAt: null, seeded: true
      });

      await addDoc(collection(db, "messages"), {
        room: "guest", uid: "veiled-witness-003", username: "Veiled Witness", rank: "Veiled Witness", role: "approved",
        text: "File WS-014 remains sealed.",
        createdAt: serverTimestamp(), expiresAt: null, seeded: true
      });
    }

    function canEnterRoom(room) {
      const role = currentUser?.role || "guest";
      if (room === "guest") return true;
      if (room === "approved") return role === "approved" || role === "admin";
      if (room === "admin") return role === "admin";
      return false;
    }

    function setupRoom(room) {
      if (!currentUser) return;
      if (!canEnterRoom(room)) {
        alert("The Coil does not recognize your rank for this room.");
        room = "guest";
      }
      currentRoom = room;
      localStorage.setItem("coil_current_room", currentRoom);
      roomSelect.value = currentRoom;
      updateRoomText();

      if (unsubscribeMessages) unsubscribeMessages();
      const q = query(collection(db, "messages"), where("room", "==", currentRoom), orderBy("createdAt", "asc"), limit(100));
      unsubscribeMessages = onSnapshot(q, async (snapshot) => {
        latestMessages = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        await cleanupExpiredMessages();
        renderMessages();
      }, (error) => fail("Message listener failed: " + error.message));
    }

    function updateRoomText() {
      const role = currentUser?.role || "guest";
      clearChatBtn.classList.toggle("hidden", role !== "admin");
      if (currentRoom === "guest") roomSubtitle.textContent = "Outer Coil · Transient Whispers";
      else if (currentRoom === "approved") roomSubtitle.textContent = "Inner Coil · Archived Voices";
      else roomSubtitle.textContent = "Black Ledger · Sealed Authority";
      roleStatus.textContent = "Role: " + role;
    }

    async function cleanupExpiredMessages() {
      const now = Date.now();
      const deletions = latestMessages.filter(msg => msg.expiresAt && msg.expiresAt <= now)
        .map(msg => deleteDoc(doc(db, "messages", msg.id)));
      if (deletions.length) await Promise.allSettled(deletions);
    }

    function listenMembers() {
      if (unsubscribeMembers) unsubscribeMembers();
      const q = query(collection(db, "profiles"), orderBy("lastSeen", "desc"), limit(50));
      unsubscribeMembers = onSnapshot(q, (snapshot) => {
        membersEl.innerHTML = "";
        snapshot.docs.forEach(d => {
          const member = { uid: d.id, ...d.data() };
          const card = document.createElement("a");
          card.className = "member-card";
          card.href = member.uid === currentUser.uid ? "./profile.html?uid=me" : "./profile.html?uid=" + encodeURIComponent(member.uid);
          card.innerHTML = `
            <div class="flex items-center gap-3">
              <img src="favicon.png" class="avatar" alt="">
              <div>
                <div class="font-cinzel text-[#d6a24a] font-bold">${escapeHtml(member.username)}</div>
                <div class="text-xs text-gray-400 mt-1">${escapeHtml(member.rank || "Guest")} · ${escapeHtml(member.role || "guest")}</div>
              </div>
            </div>
            <div class="text-xs text-gray-500 mt-2">${escapeHtml(member.bio || "No record available.")}</div>`;
          membersEl.appendChild(card);
        });
      });
    }

    function renderMessages() {
      const now = Date.now();
      const visibleMessages = latestMessages.filter(msg => !msg.expiresAt || msg.expiresAt > now);
      messagesEl.innerHTML = `<div class="text-center text-sm text-yellow-700/80 my-4 font-cinzel tracking-[.18em] uppercase">The archive is listening.</div>`;

      visibleMessages.forEach(msg => {
        const isSelf = currentUser && msg.uid === currentUser.uid;
        const isAdmin = msg.role === "admin";
        const isSystem = msg.role === "system";
        const fading = msg.expiresAt && msg.expiresAt - now < 60000;
        const div = document.createElement("div");
        div.className = "message " + (isSelf ? "self " : "") + (isAdmin ? "admin " : "") + (isSystem ? "system " : "") + (fading ? "fading" : "");
        const expiresText = msg.expiresAt ? " · fades in " + Math.max(0, Math.ceil((msg.expiresAt - now) / 1000)) + "s" : "";
        const rankClass = msg.role === "admin" ? "rank-pill rank-admin" : msg.role === "system" ? "rank-pill rank-system" : msg.role === "guest" ? "rank-pill rank-guest" : "rank-pill";
        const profileHref = isSelf ? "./profile.html?uid=me" : "./profile.html?uid=" + encodeURIComponent(msg.uid);
        div.innerHTML = `
          <div class="message-meta">
            <img src="favicon.png" class="avatar" alt="">
            <a class="username" href="${profileHref}">${escapeHtml(msg.username)}</a>
            <span class="${rankClass}">${escapeHtml(msg.rank || "Guest")}</span>
            <span class="time">${formatDate(msg.createdAt)}${expiresText}</span>
            ${(isSelf || currentUser?.role === "admin") && !isSystem ? `<button class="btn btn-danger" data-delete="${escapeHtml(msg.id)}" type="button">Delete</button>` : ""}
          </div>
          <div class="leading-relaxed">${escapeHtml(msg.text)}</div>`;
        messagesEl.appendChild(div);
      });

      document.querySelectorAll("[data-delete]").forEach(button => {
        button.addEventListener("click", async () => {
          await deleteDoc(doc(db, "messages", button.getAttribute("data-delete")));
        });
      });
      messageCount.textContent = visibleMessages.length + " archived";
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function formatDate(timestamp) {
      try {
        const date = timestamp?.toDate ? timestamp.toDate() : new Date(timestamp || Date.now());
        return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      } catch { return ""; }
    }

    function insertAtCursor(input, text) {
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      input.value = input.value.slice(0, start) + text + input.value.slice(end);
      const newPosition = start + text.length;
      input.setSelectionRange(newPosition, newPosition);
      input.focus();
    }

    document.querySelectorAll(".emoji-btn").forEach(button => button.addEventListener("click", () => insertAtCursor(messageInput, button.textContent)));

    messageForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !currentUser) return;
      if (!canEnterRoom(currentRoom)) { setupRoom("guest"); return; }

      if (currentUser.role === "guest") {
        const now = Date.now();
        if (now - lastGuestSend < GUEST_COOLDOWN_MS) {
          alert("The Coil rejects rapid whispers. Wait a moment.");
          return;
        }
        lastGuestSend = now;
        localStorage.setItem("coil_last_guest_send", String(lastGuestSend));
      }

      const expiresAt = currentRoom === "guest" || currentUser.role === "guest" ? Date.now() + GUEST_MESSAGE_LIFETIME_MS : null;
      await addDoc(collection(db, "messages"), {
        room: currentRoom, uid: currentUser.uid, username: currentUser.username || "Guest Witness",
        rank: currentUser.rank || "Guest", role: currentUser.role || "guest", text,
        createdAt: serverTimestamp(), expiresAt
      });
      messageInput.value = "";
    });

    roomSelect.addEventListener("change", () => setupRoom(roomSelect.value));

    identityBtn.addEventListener("click", async () => {
      if (!currentUser) return;
      const name = prompt("Choose your display name:", currentUser.username || "Guest Witness");
      if (!name) return;
      const cleanName = name.trim().slice(0, 32);
      if (cleanName.length < 2) { alert("Name must be at least 2 characters."); return; }
      currentUser.username = cleanName;
      localStorage.setItem("coil_username", cleanName);
      await updateDoc(doc(db, "profiles", currentUser.uid), { username: cleanName, lastSeen: serverTimestamp() });
    });

    codeBtn.addEventListener("click", async () => {
      if (!currentUser) return;
      const code = prompt("Enter access code:");
      if (!code) return;
      const cleanCode = code.trim();
      if (!ADMIN_CODES.includes(cleanCode)) { alert("The Coil does not recognize this sigil."); return; }
      const codeRef = doc(db, "usedCodes", cleanCode);
      const snap = await getDoc(codeRef);
      if (snap.exists()) { alert("This sigil has already been consumed."); return; }
      await setDoc(codeRef, { usedBy: currentUser.uid, usedAt: serverTimestamp() });
      currentUser = { ...currentUser, role: "admin", rank: "First Weeper", status: "sealed", initiateNumber: "000001", badges: ["Founder", "Admin", "The First Witness"] };
      await setDoc(doc(db, "profiles", currentUser.uid), { ...currentUser, lastSeen: serverTimestamp() }, { merge: true });
      alert("The First Weeper’s sigil has been accepted. Admin access granted.");
      setupRoom("admin");
      updateRoomText();
    });

    clearChatBtn.addEventListener("click", async () => {
      if (currentUser?.role !== "admin") { alert("Only an admin can clear a room."); return; }
      if (!confirm("Clear all non-system messages in this room?")) return;
      const roomQuery = query(collection(db, "messages"), where("room", "==", currentRoom), limit(100));
      const snapshot = await getDocs(roomQuery);
      const deletions = snapshot.docs.filter(d => d.data().role !== "system").map(d => deleteDoc(doc(db, "messages", d.id)));
      await Promise.allSettled(deletions);
    });

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>
</body>
</html>
