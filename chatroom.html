<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Serpent's Coil</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@400;600;700&display=swap');

    :root {
      --gold: #d6a24a;
      --gold-muted: #9b6a1f;
      --bone: #d8d1bf;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: var(--bone);
      font-family: Inter, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.88);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .popup {
      max-width: 460px;
      width: 100%;
      text-align: center;
      padding: 2rem 1.5rem;
      background: rgba(17,17,17,.95);
      border: 1px solid rgba(155,106,31,.7);
      border-radius: 1rem;
      box-shadow: 0 0 40px rgba(214,162,74,.15);
    }

    .popup img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 50%;
      border: 1px solid rgba(155,106,31,.6);
      box-shadow: 0 0 16px rgba(214,162,74,.22);
      margin-bottom: 1rem;
    }

    h1 {
      font-family: Cinzel, serif;
      font-size: 1.5rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--gold);
      text-shadow: 0 0 16px rgba(214,162,74,.5);
      margin: 0 0 .75rem;
    }

    p {
      line-height: 1.6;
      margin: 0 0 1.5rem;
      color: #b8a06a;
    }

    .btn {
      display: inline-block;
      border: 1px solid var(--gold-muted);
      color: var(--gold);
      padding: .7rem 1.4rem;
      border-radius: .65rem;
      background: rgba(0,0,0,.35);
      font-family: Cinzel, serif;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: .82rem;
      text-decoration: none;
      transition: .2s ease;
    }

    .btn:hover {
      color: #ffd27a;
      box-shadow: 0 0 18px rgba(214,162,74,.22);
    }
  </style>
</head>

<body>
  <div class="overlay" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
    <div class="popup">
      <img src="favicon.png" alt="The Order">
      <h1 id="popupTitle">The Coil is sealed</h1>
      <p>The Serpent's Coil is currently under maintenance.<br>Please remain calm. The archive is still listening.</p>
      <a class="btn" href="./index.html">Return</a>
    </div>
  </div>
</body>
</html>
